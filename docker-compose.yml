services:
  airflow:
    image: apache/airflow:2.10.2-python3.12
    container_name: binance_airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:HUNZA728@host.docker.internal:5432/airflow_db
      AIRFLOW__WEBSERVER__SECRET_KEY: change-me-local-dev-key
      DB_HOST: host.docker.internal
      DB_NAME: staging
      DB_USER: postgres
      DB_PASSWORD: HUNZA728
      DB_PORT: "5432"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/project
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
               airflow standalone"